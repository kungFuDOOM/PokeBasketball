<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Contact PokeJam</title>
  <style>
    :root {
      --bg: #0a0d1f; --panel: #121736; --line: #2a3170; --fg: #f2f0e6; --muted: #a9aed3; --accent: #ffcb05;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 720px; margin: 0 auto;
      padding-top: max(16px, env(safe-area-inset-top, 0px));
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    a { color: var(--accent); }
    p { margin: 0 0 10px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 8px 0; text-wrap: balance; }
    .back { display: inline-block; padding: 10px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
    .btn {
      flex: 1 1 220px; display: flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 10px 18px; border-radius: 10px; text-decoration: none;
      font-weight: 700; text-align: center; border: 2px solid var(--accent);
    }
    .btn.primary { background: var(--accent); color: #0a0d1f; }
    .btn.secondary { background: var(--panel); color: var(--accent); }
    .addr { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; overflow-wrap: anywhere; }
    .ad-line { color: var(--muted); margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
<main>
  <a class="back" href="./">← Back to the game</a>
  <h1>Contact</h1>
  <p>Reach kungFuDOOM about advertising in PokeJam or anything else: feedback, bugs and questions.</p>

  <div class="actions">
    <a class="btn primary" href="mailto:kungfudoom@mail.grokbot.com?subject=PokeJam%20advertising">Advertise in PokeJam</a>
    <a class="btn secondary" href="mailto:kungfudoom@mail.grokbot.com?subject=PokeJam">General contact</a>
  </div>

  <p class="addr">Email: <strong>kungfudoom@mail.grokbot.com</strong></p>

  <a class="back" href="./">← Back to the game</a>
  <p class="ad-line">Want your ad in PokeJam? <a href="mailto:kungfudoom@mail.grokbot.com?subject=PokeJam%20advertising">Contact us</a></p>
</main>
</body>
</html>
